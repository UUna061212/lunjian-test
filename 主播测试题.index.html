{q:'有新人主播邀请你联动，你会优先考虑？',o:[['对方有没有节目效果，能不能玩得开心',{节目:5,关系:3}],['对方实力、风评和做事方式怎么样',{实力:2,边界:4,关系:2}],['只要聊得来，尽量都维持关系',{关系:5,开团:0}],['能不能借这个机会带对方涨点流量',{关系:5,粉丝:4,节目:3}]]},
{q:'你理想中的直播状态是？',o:[['早起准时开播，每天稳定完成内容',{稳定:5,教学:2}],['有单、有比赛或有热点时再开播',{稳定:2,实力:3,抗压:3}],['根据当天状态和直播效果灵活调整',{节目:4,稳定:2,抗压:2}],['固定安排教学、复盘和长期内容',{教学:5,稳定:5}]]},
{q:'你最希望观众记住你的哪一点？',o:[['“这个主播是真有实力。”',{实力:5}],['“这个直播间特别有节目效果。”',{节目:5}],['“这个主播对粉丝挺用心。”',{粉丝:5,关系:3}],['“他总能玩出别人想不到的流派和套路。”',{打法:5,信仰:3}]]}
];
let answers=[],current=0;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function renderQuestion(){let x=questions[current];$('current').textContent=current+1;$('percent').textContent=Math.round(current/questions.length*100)+'%';$('progressBar').style.width=(current/questions.length*100)+'%';$('questionNo').textContent='QUESTION '+String(current+1).padStart(2,'0');$('questionText').textContent=x.q;$('options').innerHTML=x.o.map((o,i)=>`<button class="option" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${o[0]}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));$('backBtn').style.display=current?'inline-block':'none'}
function choose(i){answers[current]=i;if(current<questions.length-1){current++;renderQuestion()}else finish()}
function distance(a,b){return a.reduce((s,x,i)=>s+dimWeight[i]*(x-b[i])**2,0)}
function calculate(){let totals=Array(dims.length).fill(0);answers.forEach((ai,qi)=>{let e=questions[qi].o[ai][1];dims.forEach((d,i)=>totals[i]+=e[d]||0)});let avg=totals.map(x=>x/questions.length*1.25);let scored=profiles.map(p=>{let base=-distance(avg,p.v)*0.02;let matches=answers.reduce((n,a,i)=>n+(a===p.ideal[i]?1:0),0);let near=answers.reduce((n,a,i)=>n+(Math.abs(a-p.ideal[i])===1?.1:0),0);let rule=0;
// 强指向题：作为结果修正，不覆盖其他答案。
if(answers[5]===0){if(p.id==='凉神'||p.id==='珏')rule+=24;if(p.id==='后视镜')rule+=14;}
if(answers[6]===0){if(p.id==='剑寻'||p.id==='齐天')rule+=22;if(p.id==='一岚'||p.id==='凉神'||p.id==='卡比兽')rule-=22;}
if(answers[6]===3){if(p.id==='一岚'||p.id==='凉神'||p.id==='卡比兽')rule+=22;if(p.id==='剑寻'||p.id==='齐天')rule-=22;}
if(answers[7]===0&&p.id==='珏')rule+=24;
if(answers[7]===1&&p.id==='乔家劲')rule+=24;
if(answers[7]===3&&['一岚','凉神','风不臣'].includes(p.id))rule+=15;
if(answers[8]===0&&p.id==='冲就')rule+=24;
if(answers[8]===1&&['剑寻','风不臣'].includes(p.id))rule+=22;
if(answers[8]===2&&['埋','薄青','卡比兽','齐天','珏'].includes(p.id))rule+=14;
return {...p,score:base+matches*100+near+rule, matches,avg}}).sort((a,b)=>b.score-a.score);return {top:scored[0],second:scored[1],all:scored,avg}}
function finish(){let r=calculate();$('resultName').textContent=r.top.id;$('resultSubtitle').textContent=r.top.subtitle+' · 匹配度 '+Math.min(99,Math.max(68,Math.round(72+r.top.matches/15*24)))+'%';$('tags').innerHTML=r.top.tags.map(t=>`<span class="badge">${t}</span>`).join('');$('resultQuote').textContent=r.top.quote;$('reason').textContent=r.top.reason;$('keywords').textContent=r.top.keywords+'。第二接近：'+r.second.id;let max=Math.max(...r.top.avg);let ranked=r.top.avg.map((v,i)=>({d:dims[i],v})).sort((a,b)=>b.v-a.v).slice(0,5);$('bars').innerHTML=ranked.map(x=>`<div class="bar-row"><span>${x.d}</span><div class="bar"><i style="width:${Math.min(100,Math.round(x.v/max*100))}%"></i></div><b>${Math.round(x.v)}</b></div>`).join('');show('result');window.lastResult=r}
$('startBtn').onclick=()=>{answers=[];current=0;show('quiz');renderQuestion()};$('backBtn').onclick=()=>{if(current>0){current--;renderQuestion()}};$('restartBtn').onclick=()=>{$('startBtn').click()};$('copyBtn').onclick=async()=>{let t='我测出来是「'+window.lastResult.top.id+'」——'+window.lastResult.top.subtitle+'。你也来测测你是哪个论剑主播！';try{await navigator.clipboard.writeText(t);toast('结果已复制')}catch(e){toast(t)}};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
window.runSelfTest=()=>profiles.map(p=>{let old=answers;answers=p.ideal.slice();let r=calculate().top.id;answers=old;return {target:p.id,got:r,ok:r===p.id}});
</script>
